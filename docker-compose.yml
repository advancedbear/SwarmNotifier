version: '2'

services:
  swarmtool:
    build: "."
    container_name: "swarmtool"
    restart: always
    ports:
    - "3000:3000"
    volumes:
    - ".env:/app/.env:ro"
    - db_data:/app/main.db
  tunnel:
    restart: always
    image: cloudflare/cloudflared
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=*****************
volumes:
  db_data: